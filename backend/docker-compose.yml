name: approval-flow

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-approval-flow}
      POSTGRES_USER: ${POSTGRES_USER:-aeroxe}
      # Override POSTGRES_PASSWORD in production!
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeroxe}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    # -js enables JetStream; -m 8222 starts the monitoring endpoint the
    # healthcheck probes (http://localhost:8222/healthz).
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  approval-flow:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      ENV: ${ENV:-production}
      LOG_FILE_PATH: ""
      DATABASE_URL: postgres://${POSTGRES_USER:-aeroxe}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-approval-flow}?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the .env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set in the .env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in the .env file}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Trust the compose network as a proxy layer so ClientIP() can resolve
      # real clients when traffic is fronted by the web service's nginx.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Operational endpoints: swagger is off by default in production; set a
      # token here to keep /metrics available to your scraper.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # Production web tier: nginx serves the built SPA and proxies /api + /ws to
  # the backend on the same origin, so the browser never needs CORS.
  web:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "3000:80"
    depends_on:
      - approval-flow
    environment:
      BACKEND_UPSTREAM: http://approval-flow:8080
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
