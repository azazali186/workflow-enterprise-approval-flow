apiVersion: v1
kind: Secret
metadata:
  name: approval-flow-secrets
  namespace: approval-flow
type: Opaque
# IMPORTANT: stringData is a placeholder for local/dev use. In production use
# ExternalSecrets, SealedSecrets, or a managed secret store — never commit real
# credentials. All values below MUST be replaced before applying.
stringData:
  DATABASE_URL: "postgres://aeroxe:CHANGE_ME@postgres:5432/approval-flow?sslmode=require"
  JWT_SECRET: "CHANGE_ME_with_a_random_secret_of_at_least_32_characters"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "CHANGE_ME_with_a_strong_initial_password"
