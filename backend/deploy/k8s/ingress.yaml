apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: approval-flow
  namespace: approval-flow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # The referenced TLS secret must exist before the ingress becomes ready:
  # either create it manually or enable cert-manager by uncommenting the
  # cluster-issuer annotation above.
  tls:
    - hosts:
        - api.example.com
        - app.example.com
      secretName: approval-flow-tls
  rules:
    # Backend API
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: approval-flow
                port:
                  name: http
    # Frontend SPA (nginx proxies /api and /ws to the backend in-cluster, so
    # the browser is same-origin and needs no CORS)
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: approval-flow-web
                port:
                  name: http
