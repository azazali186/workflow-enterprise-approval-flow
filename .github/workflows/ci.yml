name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (fmt · vet · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      # The repo is edited on Windows (CRLF); normalize before checking format.
      - name: Normalize line endings
        run: find . -name '*.go' -exec sed -i 's/\r$//' {} +

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Concurrency bugs (data races) only surface under the race detector;
      # run it in CI since local Windows/386 toolchains cannot.
      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./...

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (typecheck · unit · build · audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  docker:
    name: Build & publish images
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          # Publish only on main; PRs just validate the Dockerfiles build.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}-web:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-web:latest

  # Definitive integration gate: boot the real docker-compose stack and drive
  # the full browser -> nginx -> backend -> NATS -> saga -> WebSocket chain.
  # Static analysis and unit tests cannot catch the bugs this catches (nginx
  # config errors, handshake hijack semantics, JetStream publish failures).
  integration:
    name: Integration (compose boot · nginx · API · WebSocket)
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-e2e]
    env:
      # Satisfy the compose interpolation and the backend's production config
      # guards (JWT_SECRET >= 32 chars, no placeholder markers).
      JWT_SECRET: ci-integration-test-secret-0123456789abcdef0123456789
      ADMIN_EMAIL: admin@integration.test
      ADMIN_PASSWORD: CiIntegrationAdminPw!2026
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Boot the full stack
        run: |
          docker compose up -d --build
          # Wait for all five services to report healthy (healthchecks in
          # docker-compose.yml / Dockerfiles).
          for i in $(seq 1 60); do
            healthy=$(docker compose ps --format '{{.Status}}' | grep -c '(healthy)' || true)
            [ "$healthy" -ge 5 ] && break
            sleep 5
          done
          docker compose ps --format 'table {{.Name}}\t{{.Status}}'

      - name: Smoke — SPA + security headers through nginx
        run: |
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsSI http://localhost:3000/ | grep -qi 'content-security-policy'
          curl -fsSI http://localhost:3000/ | grep -qi 'x-frame-options'
          echo SPA_AND_HEADERS_OK

      - name: Smoke — backend health (direct, not proxied)
        run: |
          curl -fsS http://localhost:8080/health/ready | grep -q '"status"'
          echo HEALTH_OK

      - name: Smoke — login → JWT through nginx
        run: |
          BODY=$(curl -fsS -X POST http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
          echo "$BODY" | grep -q access_token
          echo LOGIN_OK

      - name: Smoke — WebSocket push (standards-compliant client through nginx)
        run: |
          if python3 -m venv /tmp/wsvenv; then PY=/tmp/wsvenv/bin/python; else PY=python3; fi
          "$PY" -m pip install --quiet websockets
          "$PY" ws-push-test.py "$ADMIN_EMAIL" "$ADMIN_PASSWORD" | tee /tmp/ws-push.log
          grep -q PASS /tmp/ws-push.log

      - name: Smoke — WebSocket in a real browser (Playwright chromium)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/ws-smoke.mjs "$ADMIN_EMAIL" "$ADMIN_PASSWORD" | tee /tmp/ws-browser.log
          grep -q PASS /tmp/ws-browser.log

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs --tail 40 approval-flow
          docker compose logs --tail 40 web

      - name: Teardown
        if: always()
        run: docker compose down -v

